<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cuaderno EF - Evaluación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { overscroll-behavior-y: contain; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col font-sans antialiased">

    <!-- Encabezado y Pestañas de Cursos -->
    <header class="bg-blue-600 text-white shadow-md z-10">
        <div class="px-4 py-3 text-lg font-bold text-center">
            Cuaderno EF - Curso 26/27
        </div>
        <div id="tabs-container" class="flex overflow-x-auto hide-scrollbar bg-blue-700">
            <!-- Las pestañas se generan por JS -->
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Lista de Alumnos -->
        <aside class="w-2/5 max-w-[200px] bg-white border-r border-gray-200 overflow-y-auto flex flex-col" id="student-list">
            <!-- Se llena con JS -->
        </aside>

        <!-- Panel de Evaluación del Alumno -->
        <section class="flex-1 p-4 overflow-y-auto bg-gray-50 flex flex-col hide-scrollbar" id="eval-panel">
            <div class="text-center text-gray-500 mt-10" id="empty-state">
                Selecciona un alumno para evaluar.
            </div>
            
            <div id="student-content" class="hidden flex-col max-w-lg mx-auto w-full pb-10">
                <!-- Tarjeta de Perfil -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex items-center space-x-4 mb-4">
                    <div class="relative w-20 h-20 flex-shrink-0">
                        <img id="s-photo" src="" alt="Foto" class="w-20 h-20 rounded-full object-cover border-2 border-gray-100 bg-gray-100">
                        <label class="absolute bottom-0 right-0 bg-blue-600 text-white w-7 h-7 rounded-full flex items-center justify-center cursor-pointer shadow-md">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            <input type="file" id="photo-upload" accept="image/*" class="hidden">
                        </label>
                    </div>
                    <div>
                        <h2 id="s-name" class="font-bold text-lg leading-tight text-gray-800">Nombre</h2>
                        <span id="s-course" class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Curso</span>
                    </div>
                </div>

                <!-- BLOQUE 1: SAP 1 CALENTAMIENTO -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-4 border-l-4 border-l-green-500">
                    <h3 class="text-sm font-bold text-green-700 mb-3 uppercase tracking-wide">SAP 1: Calentamiento (4 Sesiones)</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">1.3 Higiene (Lista Obs.)</label>
                            <select id="s-sap1_hig" class="w-full p-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-green-500 bg-white">
                                <option value="">Seleccionar...</option>
                                <option value="Conseguido">✓ Conseguido</option>
                                <option value="En proceso">~ En proceso</option>
                                <option value="No conseguido">✗ No cons.</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">1.2 Calentamiento (Rúbrica)</label>
                            <input type="number" id="s-sap1_cal" min="1" max="5" placeholder="Nivel 1-5" class="w-full p-2 border border-gray-300 rounded text-center focus:ring-2 focus:ring-green-500">
                        </div>
                    </div>
                </div>

                <!-- BLOQUE 2: Instrumentos y Pruebas Físicas -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-4">
                    <h3 class="text-sm font-bold text-blue-700 mb-3 uppercase tracking-wide">Pruebas Físicas</h3>
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Test Plancha</label>
                            <input type="text" id="s-plancha" placeholder="Ej: 110''" class="w-full p-2 border border-gray-300 rounded text-center focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Salto Vertical</label>
                            <input type="text" id="s-salto" placeholder="Ej: 45 cm" class="w-full p-2 border border-gray-300 rounded text-center focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </div>

                <!-- BLOQUE 3: Observaciones y Nota Final -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="text-sm font-bold text-blue-700 mb-3 uppercase tracking-wide">Actitud y Global</h3>
                    <div class="mb-3">
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Diario de Clase / Registro Anecdótico</label>
                        <textarea id="s-notes" rows="3" class="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 resize-none text-sm" placeholder="Anotaciones, actitud en pista..."></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Calificación Evaluación</label>
                        <input type="number" id="s-grade" min="0" max="10" step="0.1" class="w-full text-2xl font-bold p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 text-center bg-blue-50">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const initialData = {
            "2º ESO B": [
                "Arellano Segura, Esther", "El Mkachet, Yassemine", "Gallego Collantes, Naira", "Laroussi San Martín, Samira", 
                "Madrid Neira, Leyre", "Marcilla Fernández, Adrián", "Martín Alba, Jorge", "Martín Sedano, Emma", 
                "Martínez Ubera, Daniella", "Moyano Martín, Mario", "Negueruela Morales, Catalina", "Peso Murillo, Noelia", 
                "Planchuelo Berges, Uriel", "Requeijo Vizcaíno, Noa", "Rodríguez Fernández, Jaime", "Rubio Pagola, Sofía", 
                "Ruiz Asensio, Nora", "Saidi, Soufyane", "Sainz Fernández, Victoria", "Santos Fernández, Aaron", 
                "Solana Frías, Sofía", "Villoslada del Río, Sara"
            ].map(name => ({ id: crypto.randomUUID(), name, grade: '', notes: '', photo: '', sap1_hig: '', sap1_cal: '', plancha: '', salto: '' })),
            
            "4º ESO DIV": [
                "Alonso Batrinu, Alejandro", "Amador Gabarri, Alegría", "Diéguez Ortega, Ían", "Doncel Hernández, Jeffrey Kenay", 
                "Eguizábal Osés, Naroa", "Estrada Piedra, Amelia de la Caridad", "Fábrega González, Adrian", "Fontecha Ruiz-Bazán, Nora", 
                "González Ohenhen, Denis Osaruwense", "Greca Grijalba, Alba", "Hernáez Barrasa, Yoel", "Jorge Armas, Víctor", 
                "Lagsouri, Meriem", "Ouadia El Malqi, Marwa", "Rodríguez Betancourt, Krystall Eleana", "Sáez Fernández, Allende", 
                "Yang, Cristina"
            ].map(name => ({ id: crypto.randomUUID(), name, grade: '', notes: '', photo: '', sap1_hig: '', sap1_cal: '', plancha: '', salto: '' })),

            "4º ESO A": [
                "Arnáez Martos, Laia", "Benito Pablo, Darío", "Bravo Muro, Juncal", "Castroviejo Barrasa, Adriana", 
                "Cuerva Fito, Daniel", "Estebas de Torre, Ainara", "Fernández Olasolo, Ariadna", "Fernández Blanco, Cristian", 
                "García Velandia, Paula", "García Angulo, David", "Hernández Cillero, Miguel", "Iglesias Fernández, Alejandro", 
                "Manzanares Navajas, Inés", "Marín Arroyta, Irene", "Marín Moracia, Aitana", "Martínez Jiménez, Iván", 
                "Miguel Fajardo, Raúl de", "Peñaranda Huergo, Aroa", "Pérez Azofra, Jorge", "Tabernero Segura, Andrea"
            ].map(name => ({ id: crypto.randomUUID(), name, grade: '', notes: '', photo: '', sap1_hig: '', sap1_cal: '', plancha: '', salto: '' })),
            
            "4º ESO C": [
                "Alilou Mhallem, Moussa", "Álvarez Ulecia, Laura", "Asensio Garreta, Carla", "Castañares Hernáez, Moisés", 
                "Cheikh Amallen, Mohamed", "Deulofeu González, Frank Alejandro", "Ftouh, Khaoula", "Garay Cañas, Sergio", 
                "Gutiérrez Martín, Sergio", "Hernández Campos, Alejandra Victoria", "Ijalba Álvarez, Alberto", "Martínez Terroba, Guillermo", 
                "Negueruela Morales, Teresa", "Olagaray Arraiz, Millán", "Pascual Del Campo, Carmen", "Peña Martín, Elian Jesús (Rep)", 
                "Remolina Agut, Edgar", "Rivero Sarmiento, Maily Andrea", "Rodrigo Sáenz de Jubera, Lydia", "Ruiz Ceniceros, Claudia"
            ].map(name => ({ id: crypto.randomUUID(), name, grade: '', notes: '', photo: '', sap1_hig: '', sap1_cal: '', plancha: '', salto: '' }))
        };

        let appData = initialData; // Limpiamos el guardado para forzar que carguen todos los grupos nuevos
        saveData();

        let currentCourse = Object.keys(appData)[0];
        let currentStudentId = null;

        const tabsContainer = document.getElementById('tabs-container');
        const studentListEl = document.getElementById('student-list');
        const emptyState = document.getElementById('empty-state');
        const studentContent = document.getElementById('student-content');
        
        const ui = {
            photo: document.getElementById('s-photo'),
            name: document.getElementById('s-name'),
            course: document.getElementById('s-course'),
            grade: document.getElementById('s-grade'),
            notes: document.getElementById('s-notes'),
            sap1_hig: document.getElementById('s-sap1_hig'),
            sap1_cal: document.getElementById('s-sap1_cal'),
            plancha: document.getElementById('s-plancha'),
            salto: document.getElementById('s-salto'),
            upload: document.getElementById('photo-upload')
        };

        function saveData() {
            localStorage.setItem('evalApp_data', JSON.stringify(appData));
        }

        function renderTabs() {
            tabsContainer.innerHTML = Object.keys(appData).map(course => `
                <button onclick="changeCourse('${course}')" 
                    class="px-5 py-3 text-sm font-semibold whitespace-nowrap border-b-4 transition-colors
                    ${course === currentCourse ? 'border-white text-white' : 'border-transparent text-blue-200 hover:text-white hover:bg-blue-600'}">
                    ${course}
                </button>
            `).join('');
        }

        function renderStudentList() {
            const students = appData[currentCourse];
            studentListEl.innerHTML = students.map(s => `
                <div onclick="selectStudent('${s.id}')" 
                    class="p-3 border-b border-gray-100 cursor-pointer flex items-center space-x-3 transition-colors
                    ${s.id === currentStudentId ? 'bg-blue-50 border-l-4 border-l-blue-600' : 'hover:bg-gray-50 border-l-4 border-l-transparent'}">
                    <img src="${s.photo || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI2QxZDVkYiI+PHBhdGggZD0NMjQgMjR2LTEuNWMwLTIuNS0zLjUtNC41LTYtNC41SDZjLTIuNSAwLTYgMi02IDQuNVYyNGgyNHptLTEyLTE1YzIuOCAwIDUtMi4yIDUtNXMtMi4yLTUtNS01LTUgMi4yLTUgNSAyLjIgNSA1IDV6Ii8+PC9zdmc+'}" 
                         class="w-8 h-8 rounded-full object-cover bg-gray-200 flex-shrink-0">
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-gray-800 truncate">${s.name.split(',')[0]}</p>
                        <p class="text-xs text-gray-500 truncate">${s.grade ? 'Nota: ' + s.grade : 'Sin evaluar'}</p>
                    </div>
                </div>
            `).join('');
        }

        function changeCourse(course) {
            currentCourse = course;
            currentStudentId = null;
            emptyState.classList.remove('hidden');
            studentContent.classList.add('hidden');
            renderTabs();
            renderStudentList();
        }

        function selectStudent(id) {
            currentStudentId = id;
            const student = appData[currentCourse].find(s => s.id === id);
            
            emptyState.classList.add('hidden');
            studentContent.classList.remove('hidden');
            studentContent.classList.add('flex');

            ui.name.textContent = student.name;
            ui.course.textContent = currentCourse;
            ui.photo.src = student.photo || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI2QxZDVkYiI+PHBhdGggZD0NMjQgMjR2LTEuNWMwLTIuNS0zLjUtNC41LTYtNC41SDZjLTIuNSAwLTYgMi02IDQuNVYyNGgyNHptLTEyLTE1YzIuOCAwIDUtMi4yIDUtNXMtMi4yLTUtNS01LTUgMi4yLTUgNSAyLjIgNSA1IDV6Ii8+PC9zdmc+';
            
            ['grade', 'notes', 'sap1_hig', 'sap1_cal', 'plancha', 'salto'].forEach(field => {
                ui[field].value = student[field] || '';
            });

            renderStudentList(); 
        }

        function updateStudentData(field, value) {
            if (!currentStudentId) return;
            const student = appData[currentCourse].find(s => s.id === currentStudentId);
            student[field] = value;
            saveData();
            
            if (field === 'grade') {
                renderStudentList();
            }
        }

        ['grade', 'notes', 'sap1_hig', 'sap1_cal', 'plancha', 'salto'].forEach(field => {
            ui[field].addEventListener('input', (e) => updateStudentData(field, e.target.value));
        });

        ui.upload.addEventListener('change', function(e) {
            if (!e.target.files.length || !currentStudentId) return;
            
            const file = e.target.files[0];
            const reader = new FileReader();
            
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const size = 150;
                    canvas.width = size;
                    canvas.height = size;
                    
                    const minDim = Math.min(img.width, img.height);
                    const startX = (img.width - minDim) / 2;
                    const startY = (img.height - minDim) / 2;
                    
                    ctx.drawImage(img, startX, startY, minDim, minDim, 0, 0, size, size);
                    
                    const base64Photo = canvas.toDataURL('image/jpeg', 0.7);
                    
                    ui.photo.src = base64Photo;
                    updateStudentData('photo', base64Photo);
                    renderStudentList();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        renderTabs();
        renderStudentList();
    </script>
</body>
</html>
